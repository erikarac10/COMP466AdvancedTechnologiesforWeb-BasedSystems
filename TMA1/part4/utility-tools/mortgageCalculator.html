<!-- 3. Mortgage calculator tool -->
<section id="mortgageCalculatorSection">
    <h2>Simple Mortgage</h2>
    <p>Enter the loan amount (number only), interest rate, and loan term in years to calculate your monthly mortgage payment.</p>
    <div class="flexDiv">
      <p>Loan Amount:</p>
      <input type="number" id="loanAmount">
      <p>Interest Rate (%):</p>
      <input type="number" id="interestRate">
      <p>Loan Term (years):</p>
      <input type="number" id="loanTerm">
    </div>
    <br>
    <p id="mortgageResult" class="pUtility"></p>
</section>
